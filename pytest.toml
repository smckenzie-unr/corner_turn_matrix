[pytest]

addopts = [
    "-s"
]

pythonpath = [
    ".",
    "./scripts/",
    "./tests/"
]

testpaths = [
    "./scripts/"
]

python_files = [
    "pytest_runner.py"
]

markers = [
    "input_column_counter: Counts the input address counter",
    "xilinx_tdpram_wrapper: Simulated the xpm wrapper"
]